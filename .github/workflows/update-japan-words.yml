name: Collect Japanese Trends and Publish Feed
on:
  schedule:
    # Japan time 08:15 / 20:15 = UTC 23:15 / 11:15
    - cron: '15 23,11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: japan-words-feed
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict slang-only regression tests (no network)
        run: python -m unittest discover -s tests -p 'test_slang_only.py' -v
      - name: Discover evidence-based internet slang; publish only curated bilingual entries
        run: python collector.py --root docs
      - name: Save reviewed-feed state (never modify personal Firebase)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Remove the obsolete ordinary-news term archive from public Pages.
          rm -f docs/state.json
          git add -A docs
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish sourced Japanese internet slang only'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: pages
        uses: actions/deploy-pages@v4
