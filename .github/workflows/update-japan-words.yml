name: Collect Japanese Trends and Publish Feed
on:
  schedule:
    # 08:15 and 20:15 Asia/Tokyo; cron is UTC.
    - cron: '15 23,11 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: japan-words-feed
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tokenizer
        run: pip install -r requirements.txt
      - name: Run collector regression tests
        run: python -m unittest discover -s tests -v
      - name: Set monthly reference cache key
        id: cache-month
        run: echo "month=$(date -u +%Y%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .dictionary-cache
          key: jp-bilingual-dictionaries-v852-${{ steps.cache-month.outputs.month }}
      - name: Aggregate permitted RSS summaries
        run: python collector.py --root docs
      - name: Save rolling dictionary for the next scheduled run
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/feed.json docs/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Japanese words feed'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: pages
        uses: actions/deploy-pages@v4
