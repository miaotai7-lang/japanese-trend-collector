name: Validate genuine internet slang only (no publication)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all isolated slang and translation quality regression tests
        run: |
          python -m unittest discover -s tests -p 'test_slang_only.py' -v
          python -m unittest discover -s tests -p 'test_translation_review.py' -v
          python -m unittest discover -s tests -p 'test_auto_publish.py' -v
          python -m unittest discover -s tests -p 'test_community_sources.py' -v
          python -m unittest discover -s tests -p 'test_blog_sources.py' -v
      - name: Probe selected creator RSS feeds (read-only, temporary diagnostics)
        run: |
          python - <<'PY'
          from blog_sources import CREATORS,fetch_blogger,collect_blogs
          from slang_only import JST,BLACKLIST
          from datetime import datetime
          for slug,name,url in CREATORS:
              try:
                  rows,state,status=collect_blogs(datetime.now(JST),{},BLACKLIST,set(),
                    fetcher=lambda u:fetch_blogger(u) if u==url else b'<rss><channel/></rss>')
                  source=next(x for x in status if x['name']=='知识博主RSS:'+slug)
                  print(slug,'articles:',source.get('articles',0),
                        'mentions:',source.get('candidateMentions',0),
                        'signal_words:',len(rows),'status:',source['status'])
              except Exception as e:print(slug,type(e).__name__,str(e)[:100])
          PY
      - name: Publish to temporary directory only; audit slang and bilingual content
        run: |
          python - <<'PY'
          import json, tempfile
          from datetime import datetime, timedelta, timezone
          from slang_only import run
          with tempfile.TemporaryDirectory() as t:
              f=run(t,'slang_terms.json',no_network=True)
              forbidden={'情報','会社','見る','食べる','アクセス','いい','れる'}
              assert f['feedType']=='japanese-internet-slang-only'
              assert len(f['items'])>=6
              assert all(x['jp'] not in forbidden and x['zh'] and x['en'] and x['kana'] and x['sources'] for x in f['items'])
              print('Approved recent slang:',len(f['items']))
              print('Preview:', [(x['jp'],x['zh'],x['en']) for x in f['items'][:5]])
          PY
