name: Validate Japanese word quality and sourced slang (no publication)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run local regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify licensed dictionaries and research-backed slang
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from collector import load_json, build_feed, normalize
          from quality import load_reference_dictionaries, improve_entries
          from trend_signals import load_reviewed,import_reviewed
          now=datetime.now(timezone(timedelta(hours=9)))
          zh,en=load_reference_dictionaries('.dictionary-cache')
          state=load_json('docs/state.json',{'terms':{},'seenDocs':{}})
          metric=improve_entries(state,zh,en)
          approved=load_reviewed('data/verified_slang.json',now.date())
          import_reviewed(state,approved,now,normalize)
          feed=build_feed(state,now,[])
          trends=[w for w in feed['items'] if w.get('trendCurrent')]
          print('DICTIONARIES:',len(zh),len(en))
          print('QUALITY:',metric)
          print('EVIDENCE-BASED SLANG:',[(w['jp'],w['evidenceDate'],w['evidencePublisher']) for w in trends])
          print('GENERAL VOCABULARY:',len(feed['items'])-len(trends))
          print('REVIEW QUEUE:',feed['counts'].get('reviewQueue'))
          assert len(zh)>1000 and len(en)>1000
          assert len(approved)>=7 and len(trends)>=7
          assert all(w['zh'] and w['en'] and w['kana'] for w in feed['items'])
          assert all(w['jp'] not in ('いい','れる') for w in feed['items'])
          assert all(w.get('trendVerified') and w.get('evidenceDate') for w in trends)
          assert not any(w['jp'] in ('女性','監督','行く','帰る') and w.get('trendCurrent') for w in feed['items'])
          PY
