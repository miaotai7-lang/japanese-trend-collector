name: Validate genuine internet slang only (no publication)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all isolated slang and translation quality regression tests
        run: |
          python -m unittest discover -s tests -p 'test_slang_only.py' -v
          python -m unittest discover -s tests -p 'test_translation_review.py' -v
      - name: Diagnose live public survey ranking parser (read-only)
        run: |
          python - <<'PY'
          from slang_only import fetch_public, CURRENT_REPORT, PlainText, ranked_slang_from_report
          src=fetch_public(CURRENT_REPORT).decode('utf-8',errors='replace')
          p=PlainText();p.feed(src);plain=p.text()
          print('raw-html-chars:',len(src),'plain-chars:',len(plain))
          for needle in ('今流行っている言葉','メロい','ドパガキ','1位'):
              pos=plain.find(needle)
              print('marker:',needle,'pos:',pos,'context:',repr(plain[max(pos-100,0):pos+400]) if pos>=0 else 'N/A')
          print('extracted:',ranked_slang_from_report(src))
          PY
      - name: Publish to temporary directory only; audit slang and bilingual content
        run: |
          python - <<'PY'
          import json, tempfile
          from datetime import datetime, timedelta, timezone
          from slang_only import run
          with tempfile.TemporaryDirectory() as t:
              f=run(t,'slang_terms.json',no_network=True)
              forbidden={'情報','会社','見る','食べる','アクセス','いい','れる'}
              assert f['feedType']=='japanese-internet-slang-only'
              assert len(f['items'])>=6
              assert all(x['jp'] not in forbidden and x['zh'] and x['en'] and x['kana'] and x['sources'] for x in f['items'])
              print('Approved recent slang:',len(f['items']))
              print('Preview:', [(x['jp'],x['zh'],x['en']) for x in f['items'][:5]])
          PY
