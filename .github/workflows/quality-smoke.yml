name: Validate bilingual word quality (no publication)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check authentic dictionary downloads and public feed compatibility
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from collector import load_json, build_feed
          from quality import load_reference_dictionaries, improve_entries
          zh,en = load_reference_dictionaries('.dictionary-cache')
          state = load_json('docs/state.json', {'terms':{},'seenDocs':{}})
          metrics = improve_entries(state, zh, en)
          data = build_feed(state,datetime.now(timezone(timedelta(hours=9))),[])
          print('LEXICONS:',len(zh),'Chinese and',len(en),'English')
          print('QUALITY:',metrics)
          print('PREVIEW:', [(x['jp'],x['zh'][:22],x['en'][:24]) for x in data['items'][:12]])
          assert len(zh) > 1000 and len(en) > 1000
          assert len(data['items']) >= 15, 'Insufficient bilingual coverage; do not publish'
          assert all(x['jp'] not in ('いい','れる') and x['zh'] and x['en'] for x in data['items'])
          PY
